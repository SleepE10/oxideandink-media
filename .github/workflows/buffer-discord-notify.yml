name: Buffer Publish -> Discord Notify

on:
  schedule:
    # 17:30-20:00 MEZ/MESZ (Europe/Berlin) alle 5 Minuten; Script prueft exaktes Zeitfenster
    - cron: "30-59/5 15 * * *"
    - cron: "*/5 16-18 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Zeitfenster ignorieren (manueller Test)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore notified posts state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: buffer-notify-${{ github.run_id }}
          restore-keys: |
            buffer-notify-

      - name: Check Buffer and notify Discord
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python scripts/buffer_discord_notify.py --state-file .state/notified_posts.json --force
          else
            python scripts/buffer_discord_notify.py --state-file .state/notified_posts.json
          fi

      - name: Save notified posts state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: buffer-notify-${{ github.run_id }}
